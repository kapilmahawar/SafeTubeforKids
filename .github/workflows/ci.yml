name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The device-free checks this project depends on: the unit tests, which pin the quality
      # policy, the seek escalation, export/import and session handling, plus a parse of the
      # dashboard JavaScript, which is hand-written and has no build step of its own.
      - name: Unit tests and debug build
        working-directory: tv-app
        run: |
          chmod +x ./gradlew
          # Both variants: the release unit suite exists and is what caught a timing race in a W13.6 test
          # (it passed in debug and failed in release, where the load is slower). Building the release APK
          # itself needs a keystore that is deliberately not in this repository, so only the tests run here.
          ./gradlew --no-daemon --stacktrace assembleDebug testDebugUnitTest testReleaseUnitTest

      # A device-free assertion that the two instrumentation tests which replace or clear a parent credential
      # stay inside the class that is skipped unless it is opted into (W13.8-A). It runs before the Android
      # steps so it fails fast on a runner with no device attached.
      - name: Instrumentation safety check
        working-directory: tv-app
        run: node --test scripts/check-destructive-instrumentation.test.js

      - name: Check the dashboard JavaScript parses
        run: |
          node --check tv-app/app/src/main/assets/app.js
          node --check tv-app/app/src/main/assets/theme.js
          node --check tv-app/app/src/main/assets/catalog-editor.js
          node --check tv-app/app/src/main/assets/catalog-yaml.js
          node --check tv-app/app/src/main/assets/parent-access.js

      # The dashboard's model and the guards over the page it ships with. Plain Node, no
      # dependencies, and the thing that keeps the page and the script in step: a control wired to
      # nothing, a token that was never defined, or a browser-storage key that should not exist
      # fails here rather than on somebody's phone.
      - name: Dashboard model and guard tests
        working-directory: tv-app
        run: >-
          node --test scripts/dashboard-catalog-editor.test.js
          scripts/dashboard-catalog-import.test.js
          scripts/dashboard-catalog-ui.test.js
          scripts/dashboard-catalog-yaml.test.js
          scripts/dashboard-parent-access.test.js

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeTubeforKids-debug
          path: tv-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
