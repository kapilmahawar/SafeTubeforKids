<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="SafeTube — choose what your child can watch on the TV.">
    <title>SafeTube</title>
    <link rel="icon" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <!-- Loaded before the page paints, so the palette never flashes. -->
    <script src="theme.js"></script>
</head>
<body>
    <a class="skip-link" href="#view">Skip to the content</a>

    <!-- The shell carries no screens. Every screen is rendered into #view by app.js, and the two
         bars below are the only chrome there is: what your child can watch, and everything else. -->
    <header class="topbar" id="topbar" hidden>
        <button class="brand" type="button" data-action="go-library">
            <span class="brand__mark" aria-hidden="true">●</span>
            <span class="brand__name">SafeTube</span>
        </button>

        <div class="topbar__right">
            <p class="pill" id="tv-state" role="status" aria-live="polite" hidden></p>
            <button class="theme-toggle" type="button" id="theme-toggle" data-action="toggle-theme"
                    aria-pressed="false">
                <span class="theme-toggle__icon" id="theme-icon" aria-hidden="true">🌙</span>
                <span class="theme-toggle__label" id="theme-label">Dark</span>
            </button>
        </div>
    </header>

    <main class="view" id="view" tabindex="-1"></main>

    <nav class="tabbar" id="tabbar" aria-label="Sections" hidden>
        <button class="tab" type="button" id="tab-library" data-action="go-library">
            <span class="tab__icon" aria-hidden="true">🎬</span>
            <span class="tab__label">Library</span>
        </button>
        <button class="tab" type="button" id="tab-settings" data-action="go-settings">
            <span class="tab__icon" aria-hidden="true">⚙️</span>
            <span class="tab__label">Settings</span>
        </button>
    </nav>

    <div class="toasts" id="toasts" aria-live="polite" aria-atomic="true"></div>

    <script src="catalog-editor.js"></script>
    <script src="app.js"></script>
</body>
</html>
